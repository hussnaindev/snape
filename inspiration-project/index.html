<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Swan</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600&family=Archivo+Narrow:wght@400;500;600;700;900&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #070b08;
      --fern: #2d5a3d;
      --sage: #a8d5b5;
      --gold: #d4af6e;
    }

    html,
    body {
      background: var(--black);
      color: #fff;
      font-family: 'Archivo Narrow', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 16/11;
      overflow: hidden;
      background: #0a100b;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* SECTION DIVIDER */
    .section-divider {
      display: flex;
      align-items: center;
      margin: 0;
    }

    .section-divider.transparent {
      margin-top: -28px;
      position: relative;
      z-index: 10;
    }

    .divider-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.85);
    }

    .section-divider.transparent .divider-line {
      background: transparent;
    }

    .divider-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      background: var(--black);
    }

    .section-divider.transparent .divider-pill {
      background: transparent;
    }

    .divider-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #fff;
    }

    /* REEL GRID */
    .reel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0px;
    }

    .reel-tile {
      position: relative;
      aspect-ratio: 620/960;
      overflow: hidden;
      background: #0a100b;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }

    .reel-tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .reel-tile:hover img {
      transform: scale(1.03);
    }

    .reel-tile-border {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.10);
      pointer-events: none;
    }

    /* FEATURED MODELS */
    .models-scroll-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 18px 14px;
    }

    .models-scroll-wrap::-webkit-scrollbar {
      display: none;
    }

    .models-track {
      display: flex;
      gap: 0;
      width: max-content;
    }

    .model-item {
      display: flex;
      align-items: flex-end;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .model-card {
      position: relative;
      width: 120px;
      height: calc(120px * 1.71);
      border-radius: 14px;
      overflow: hidden;
      background: #0a100b;
      z-index: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .model-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .model-card-border {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .model-name-pill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.65);
      padding: 5px 7px 6px;
    }

    .model-name-text {
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 1.8px;
      color: #fff;
      text-align: center;
      text-transform: uppercase;
    }

    /* TAG CLOUD */
    .tags-section {
      padding: 12px 16px 40px;
    }

    .tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-chip {
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.60);
      letter-spacing: 0.3px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s, color 0.18s;
      white-space: nowrap;
    }

    .tag-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
    }

    /* TOPBAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: linear-gradient(to bottom, rgba(7, 11, 8, 0.88) 0%, transparent 100%);
      pointer-events: none;
    }

    .topbar svg {
      flex-shrink: 0;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
    }

    /* SKELETON SHIMMER */
    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    .skeleton {
      background: linear-gradient(90deg, #111 25%, #222 50%, #111 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    .hero-skeleton {
      position: absolute;
      inset: 0;
      z-index: 1;
      transition: opacity 0.5s ease;
    }

    .hero-skeleton.loaded {
      opacity: 0;
      pointer-events: none;
    }

    .reel-tile .tile-skeleton {
      position: absolute;
      inset: 0;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    .reel-tile .tile-skeleton.loaded {
      opacity: 0;
      pointer-events: none;
    }

    .model-card .card-skeleton {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 14px;
      transition: opacity 0.4s ease;
    }

    .model-card .card-skeleton.loaded {
      opacity: 0;
      pointer-events: none;
    }

    /* REEL TILE PREVIEW VIDEO */
    .reel-tile .tile-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 2;
      pointer-events: none;
    }

    .reel-tile .tile-preview.playing {
      opacity: 1;
    }

    @media (min-width: 640px) {
      .hero {
        aspect-ratio: 16/9;
        max-height: 600px;
      }

      .reel-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

  <script>
    // Hero videos
    function setHero(videoId, skeletonId, src) {
      var v = document.getElementById(videoId);
      var sk = document.getElementById(skeletonId);
      v.src = src;
      v.addEventListener('canplay', function () { sk.classList.add('loaded'); }, { once: true });
    }
    setHero('hero-brand-new', 'sk-hero-brand-new', pickFrom(HERO_URLS.brandNew));
    setHero('hero-hottest', 'sk-hero-hottest', pickFrom(HERO_URLS.hottest));
    setHero('hero-bts', 'sk-hero-bts', pickFrom(HERO_URLS.bts));
    setHero('hero-upcoming', 'sk-hero-upcoming', pickFrom(HERO_URLS.upcoming));

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    var shuffled = shuffle(REELS_DATA);

    // === UPDATED: Make reel tiles link to reels.html with ID ===
    function makeReelTile(reel) {
      var a = document.createElement('a');
      a.href = `reels.html?id=${reel.id}`;
      a.className = 'reel-tile';
      a.setAttribute('data-preview-src', proxy(reel.sd || reel.hd));
      a.setAttribute('data-preview-state', 'idle');

      // Skeleton
      var sk = document.createElement('div');
      sk.className = 'tile-skeleton skeleton';

      // Poster image
      var img = document.createElement('img');
      img.src = proxy(reel.poster);
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('load', function () { sk.classList.add('loaded'); }, { once: true });
      img.addEventListener('error', function () { sk.classList.add('loaded'); }, { once: true });

      // Preview video
      var vid = document.createElement('video');
      vid.className = 'tile-preview';
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      vid.preload = 'none';
      vid.setAttribute('playsinline', '');
      vid.setAttribute('webkit-playsinline', '');
      vid.setAttribute('loop', '');

      var border = document.createElement('div');
      border.className = 'reel-tile-border';

      a.appendChild(sk);
      a.appendChild(img);
      a.appendChild(vid);
      a.appendChild(border);
      return a;
    }

    shuffled.slice(0, 4).forEach(function (r) {
      document.getElementById('brand-new-grid').appendChild(makeReelTile(r));
    });
    shuffled.slice(4, 8).forEach(function (r) {
      document.getElementById('hottest-grid').appendChild(makeReelTile(r));
    });

    // Preview logic (unchanged)
    var PREVIEW_SECONDS = 3;
    var previewObserver = null;
    var autoplayQueue = new Set();

    function bufferedSecondsFromStart(video) {
      if (!video || !video.buffered || video.buffered.length === 0) return 0;
      try {
        var end = video.buffered.end(video.buffered.length - 1);
        return Math.max(0, end - video.currentTime);
      } catch (e) { return 0; }
    }

    function hasEnoughPreviewBuffered(video) {
      if (!video) return false;
      if (video.readyState < HTMLMediaElement.HAVE_FUTURE_DATA) return false;
      var buffered = bufferedSecondsFromStart(video);
      if (video.duration && isFinite(video.duration)) {
        return buffered >= Math.min(PREVIEW_SECONDS, video.duration);
      }
      return buffered >= PREVIEW_SECONDS;
    }

    function clearPreviewMonitor(tile) {
      if (tile.__previewMonitor) { clearInterval(tile.__previewMonitor); tile.__previewMonitor = null; }
      if (tile.__previewTimer) { clearTimeout(tile.__previewTimer); tile.__previewTimer = null; }
    }

    function startTilePreview(tile) {
      var vid = tile.querySelector('.tile-preview');
      if (!vid) return;
      var src = tile.getAttribute('data-preview-src');
      if (!src) return;

      if (!vid.src) {
        vid.src = src;
        vid.preload = 'auto';
        vid.loop = true;
        vid.load();
      }

      if (tile.getAttribute('data-preview-state') === 'playing') return;

      tile.setAttribute('data-preview-state', 'loading');
      clearPreviewMonitor(tile);

      var tryPlay = function () {
        if (!autoplayQueue.has(tile)) return;
        if (!hasEnoughPreviewBuffered(vid)) return;

        clearPreviewMonitor(tile);
        try { vid.currentTime = 0; } catch (e) { }

        var onStarted = function () {
          if (!autoplayQueue.has(tile)) return;
          vid.classList.add('playing');
          tile.setAttribute('data-preview-state', 'playing');
        };

        var playPromise = vid.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(onStarted).catch(() => { tile.setAttribute('data-preview-state', 'idle'); });
        } else {
          onStarted();
        }
      };

      if (hasEnoughPreviewBuffered(vid)) {
        tryPlay();
        return;
      }

      tile.__previewMonitor = setInterval(tryPlay, 120);
      tryPlay();
    }

    function stopTilePreview(tile) {
      autoplayQueue.delete(tile);
      clearPreviewMonitor(tile);
      var vid = tile.querySelector('.tile-preview');
      if (!vid) return;
      vid.classList.remove('playing');
      try { vid.pause(); } catch (e) { }
      try { vid.currentTime = 0; } catch (e) { }
      tile.setAttribute('data-preview-state', 'idle');
    }

    function observeReelTiles() {
      if (!('IntersectionObserver' in window)) {
        document.querySelectorAll('.reel-tile').forEach(function (tile) {
          autoplayQueue.add(tile);
          startTilePreview(tile);
        });
        return;
      }

      previewObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var tile = entry.target;
          if (entry.isIntersecting && entry.intersectionRatio > 0.45) {
            autoplayQueue.add(tile);
            startTilePreview(tile);
          } else {
            stopTilePreview(tile);
          }
        });
      }, {
        root: null,
        rootMargin: '120px 0px',
        threshold: [0, 0.25, 0.45, 0.75, 1]
      });

      document.querySelectorAll('.reel-tile').forEach(function (tile) {
        previewObserver.observe(tile);
      });
    }

    observeReelTiles();

    // Featured Models & Tags (unchanged)
    var track = document.getElementById('models-track');
    PERFORMERS_DATA.forEach(function (p, i) {
      var rank = i + 1;
      var rankW = rank === 1 ? 48 : rank < 10 ? 78 : 88;
      var bleed = 8;
      var fs = rank < 10 ? 90 : 74;
      var item = document.createElement('div');
      item.className = 'model-item';

      var rankEl = document.createElement('div');
      rankEl.style.cssText = `font-family:'Archivo Narrow',sans-serif;font-weight:900;font-size:${fs}px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,0.55);letter-spacing:-4px;padding-bottom:4px;width:${rankW}px;margin-right:-${bleed}px;flex-shrink:0;z-index:0;display:flex;align-items:flex-end;justify-content:flex-end;`;
      rankEl.textContent = rank;

      var card = document.createElement('div');
      card.className = 'model-card';

      var sk = document.createElement('div');
      sk.className = 'card-skeleton skeleton';

      var img = document.createElement('img');
      img.src = proxy(p.url);
      img.alt = p.name;
      img.loading = 'lazy';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      img.addEventListener('load', function () { sk.classList.add('loaded'); }, { once: true });
      img.addEventListener('error', function () { sk.classList.add('loaded'); }, { once: true });

      var cardBorder = document.createElement('div');
      cardBorder.className = 'model-card-border';

      var namePill = document.createElement('div');
      namePill.className = 'model-name-pill';
      var nameText = document.createElement('div');
      nameText.className = 'model-name-text';
      nameText.textContent = p.name.toUpperCase();
      namePill.appendChild(nameText);

      card.appendChild(sk);
      card.appendChild(img);
      card.appendChild(cardBorder);
      card.appendChild(namePill);
      item.appendChild(rankEl);
      item.appendChild(card);
      track.appendChild(item);
    });

    var tagCounts = {};
    REELS_DATA.forEach(function (r) { r.tags.forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
    var topTags = Object.entries(tagCounts).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 24).map(function (x) { return x[0]; });
    var wrap = document.getElementById('tags-wrap');
    topTags.forEach(function (tag) {
      var c = document.createElement('a');
      c.href = '#'; c.className = 'tag-chip'; c.textContent = '#' + tag;
      wrap.appendChild(c);
    });
  </script>
</body>

</html>
