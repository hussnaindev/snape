<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Swan · Reels</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700;900&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #070b08;
      --fern: #2d5a3d;
      --sage: #a8d5b5;
      --like: #e05a5a;
    }

    html,
    body {
      background: #000;
      color: #fff;
      font-family: 'Archivo Narrow', sans-serif;
      height: 100%;
      overflow: hidden;
    }

    #feed {
      position: fixed;
      inset: 0;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    #feed::-webkit-scrollbar {
      display: none;
    }

    .reel-item {
      position: relative;
      width: 100vw;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }

    .reel-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1.5px;
      background: rgba(168, 213, 181, 0.1);
      z-index: 20;
    }

    .progress-fill {
      height: 100%;
      background: var(--sage);
      width: 0%;
      transition: width 0.25s linear;
    }

    .rail {
      position: absolute;
      right: 14px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .action-glyph {
      font-size: 26px;
      font-weight: 300;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      line-height: 1;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: block;
    }

    .action-btn:active .action-glyph {
      transform: scale(0.7);
    }

    .action-glyph.liked {
      color: var(--like);
    }

    .action-glyph.saved {
      color: var(--sage);
    }

    .action-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.2px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
    }

    .info-block {
      position: absolute;
      left: 14px;
      right: 60px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.2px;
    }

    .stat-glyph {
      font-size: 13px;
      line-height: 1;
    }

    .tags-block {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 50px;
      overflow: hidden;
    }

    .tag-chip {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 999px;
      padding: 3px 9px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.3px;
      line-height: 16px;
      white-space: nowrap;
    }

    .mute-flash {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
    }

    .mute-flash.visible {
      opacity: 1;
    }

    .mute-flash.hide {
      opacity: 0;
      transition: opacity 0.5s 0.4s;
    }

    .mute-glyph {
      font-size: 34px;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
    }

    .mute-label-txt {
      font-size: 10px;
      letter-spacing: 1.4px;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
    }

    .heart-burst {
      position: absolute;
      pointer-events: none;
      z-index: 30;
      font-size: 64px;
      color: var(--like);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
      transform: scale(0);
      opacity: 0;
    }

    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      z-index: 200;
    }

    .loader svg {
      animation: spin 1.8s ease-in-out infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg) scale(1);
        opacity: 0.8;
      }

      50% {
        transform: rotate(180deg) scale(1.08);
        opacity: 1;
      }

      100% {
        transform: rotate(360deg) scale(1);
        opacity: 0.8;
      }
    }

    .loader.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="loader" id="loader">
    <svg width="44" height="44" viewBox="0 0 512 512" fill="none">
      <g transform="matrix(-1,0,0,1,512,0)">
        <path fill="#a8d5b5"
          d="M372.67 44.934c-50.275.005-92.476 43.57-38.934 163.87 29.137 16.804 41.594 46.767 33.48 74.848-9.168 31.735-42.353 59.517-96.597 68.084-45.02 7.11-88.46 2.42-122.915-22.218-14.895-10.65-27.867-24.905-38.502-43.088-26.314-8.87-48.678-17.086-61.224-23.25-.197 10.192 1.916 21.786 6.594 33.963l-35.842-4.432L70.87 332.49 43.92 344.385l53.35 11.676c10.984 9.717 23.94 18.99 39.07 27.38l-.002.007c26.098 14.475 195.407 11.62 218.51.578 67.333-32.17 71.596-90.7 28.552-167.472-57.378-102.34-31.747-134.085 3.034-133.07.93 10.53 6.27 21.943 15.593 31.288 5.74 5.757 12.266 9.993 18.886 12.623 19.37 11.416 38.896 19.675 62.072 20.81 5.712.08 9.144-9.696 3.487-10.238-11.602-2.262-21.402-8.37-29.352-15.912 11.712-12.976 7.85-36.605-8.994-53.49-11.038-11.06-24.963-16.53-36.898-15.692-12.41-5.107-25.747-7.938-38.562-7.936zm56.598 37.433c6.16 0 10.95 4.793 10.95 10.953 0 6.157-4.79 10.95-10.95 10.95-6.16 0-10.954-4.793-10.954-10.95 0-6.156 4.795-10.953 10.954-10.953zm-208.653 118.95c-6.108.034-12.128.27-18.18.607-29.242 1.63-59.597 5.87-101.03 1.365 28.59 40.045 73.354 51.978 116.91 49.04-32.74 15.03-75.678 8.755-108.41-10.848.475 1.48.96 2.94 1.454 4.38 17.087 33.357 62.417 42.17 88.845 42.066-16.554 11.997-42.21 12.406-65.994 2.386 7.334 9.737 15.51 17.67 24.366 24.002 29.323 20.968 67.166 25.59 109.127 18.96 49.298-7.785 74.954-31.945 81.56-54.81 6.607-22.867-3.598-45.977-34.556-58.134-36.452-14.313-63.225-18.523-87.95-18.975-2.06-.037-4.106-.05-6.142-.04zM64.14 378.278c-29.424 5.99-46.933 13.47-46.933 21.588 0 19.668 102.56 35.612 229.072 35.612s229.072-15.944 229.072-35.612c0-8.098-17.424-15.562-46.72-21.545 12.117 3.613 18.923 7.643 18.923 11.895 0 15.515-90.098 28.092-201.24 28.092-111.14 0-201.24-12.577-201.24-28.092 0-4.27 6.858-8.314 19.064-11.938z" />
      </g>
    </svg>
  </div>

  <div id="feed"></div>

  <script src="config.js"></script>
  <script src="reels-data.js"></script>
  <script>
    function fmtNum(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
      return String(n);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Get reel ID from URL
    function getUrlParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    const feed = document.getElementById('feed');
    const loader = document.getElementById('loader');

    let reels = shuffle(REELS_DATA);
    const requestedId = getUrlParameter('id');

    // If a specific reel ID was passed, move it to the front
    if (requestedId) {
      const specificReel = REELS_DATA.find(r => String(r.id) === String(requestedId));
      if (specificReel) {
        reels = reels.filter(r => String(r.id) !== String(requestedId));
        reels.unshift(specificReel);
      }
    }

    const state = reels.map(r => ({ liked: false, likeCount: r.likes, saved: false }));

    function buildReelItem(reel, idx) {
      const item = document.createElement('div');
      item.className = 'reel-item';
      item.dataset.idx = idx;

      const videoSrc = proxy(reel.hd || reel.sd);
      const posterSrc = proxy(reel.poster);

      item.innerHTML = `
      <video class="reel-video" loop playsinline preload="none"
             poster="${posterSrc}" data-src="${videoSrc}"></video>

      <div class="progress-bar"><div class="progress-fill" id="prog-${idx}"></div></div>

      <div class="mute-flash" id="mf-${idx}">
        <span class="mute-glyph" id="mg-${idx}">◌</span>
        <span class="mute-label-txt" id="ml-${idx}">muted</span>
      </div>

      <div class="rail">
        <div class="action-btn" id="like-btn-${idx}" data-idx="${idx}">
          <span class="action-glyph" id="like-glyph-${idx}">♡</span>
          <span class="action-label" id="like-count-${idx}">${fmtNum(state[idx].likeCount)}</span>
        </div>
        <div class="action-btn" id="comment-btn-${idx}">
          <span class="action-glyph">◎</span>
        </div>
        <div class="action-btn" id="share-btn-${idx}">
          <span class="action-glyph">↑</span>
        </div>
        <div class="action-btn" id="save-btn-${idx}" data-idx="${idx}">
          <span class="action-glyph" id="save-glyph-${idx}">⊹</span>
        </div>
      </div>

      <div class="info-block">
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-glyph">◈</span>
            <span>${fmtNum(reel.views)}</span>
          </div>
          <div class="stat-item" id="stat-likes-${idx}">
            <span class="stat-glyph">♡</span>
            <span>${fmtNum(state[idx].likeCount)}</span>
          </div>
        </div>
        <div class="tags-block">
          ${reel.tags.slice(0, 10).map(t => `<span class="tag-chip">#${t}</span>`).join('')}
        </div>
      </div>
    `;
      return item;
    }

    const BATCH = 10;
    let rendered = 0;

    function renderBatch(n) {
      const end = Math.min(rendered + n, reels.length);
      for (let i = rendered; i < end; i++) {
        feed.appendChild(buildReelItem(reels[i], i));
      }
      rendered = end;
    }

    renderBatch(BATCH);

    // Video management
    let activeIdx = 0;
    const muteState = {};

    function getVideo(idx) {
      const el = feed.querySelector(`.reel-item[data-idx="${idx}"]`);
      return el ? el.querySelector('.reel-video') : null;
    }

    function loadVideo(idx) {
      const v = getVideo(idx);
      if (v && !v.src && v.dataset.src) {
        v.src = v.dataset.src;
        v.load();
      }
    }

    function playVideo(idx) {
      const v = getVideo(idx);
      if (!v) return;
      loadVideo(idx);

      // AUDIO ON BY DEFAULT
      v.muted = false;                    // ← Changed: sound is ON by default
      muteState[idx] = false;             // Track that it's unmuted

      v.play().catch(() => {
        // Fallback: if autoplay with sound is blocked, mute it
        v.muted = true;
        muteState[idx] = true;
        v.play().catch(() => { });
      });
    }

    function pauseVideo(idx) {
      const v = getVideo(idx);
      if (!v) return;
      v.pause();
      v.currentTime = 0;
      const p = document.getElementById(`prog-${idx}`);
      if (p) p.style.width = '0%';
    }

    function preloadNeighbors(idx) {
      loadVideo(idx - 1);
      loadVideo(idx + 1);
      if (idx + 5 >= rendered && rendered < reels.length) renderBatch(BATCH);
    }

    // Progress
    const progTimers = {};
    function startProgress(idx) {
      if (progTimers[idx]) return;
      progTimers[idx] = setInterval(() => {
        const v = getVideo(idx);
        const p = document.getElementById(`prog-${idx}`);
        if (v && p && v.duration) {
          p.style.width = ((v.currentTime / v.duration) * 100) + '%';
        }
      }, 200);
    }

    function stopProgress(idx) {
      clearInterval(progTimers[idx]);
      delete progTimers[idx];
    }

    // Intersection Observer
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.intersectionRatio < 0.6) return;
        const idx = parseInt(entry.target.dataset.idx);

        pauseVideo(activeIdx);
        stopProgress(activeIdx);

        activeIdx = idx;
        playVideo(idx);
        startProgress(idx);
        preloadNeighbors(idx);

        loader.classList.add('hidden');
      });
    }, { threshold: 0.6 });

    function observeNew() {
      feed.querySelectorAll('.reel-item:not([data-observed])').forEach(el => {
        observer.observe(el);
        el.dataset.observed = '1';
      });
    }
    observeNew();
    new MutationObserver(observeNew).observe(feed, { childList: true });

    // Tap handlers
    const lastTap = {}, tapTimer = {};

    feed.addEventListener('click', e => {
      const item = e.target.closest('.reel-item');
      if (!item || e.target.closest('.action-btn')) return;
      const idx = parseInt(item.dataset.idx);
      const now = Date.now();

      if (now - (lastTap[idx] || 0) < 280) {
        clearTimeout(tapTimer[idx]);
        lastTap[idx] = 0;
        triggerLike(idx);
        showHeart(e.clientX, e.clientY, item);
      } else {
        lastTap[idx] = now;
        tapTimer[idx] = setTimeout(() => toggleMute(idx), 280);
      }
    });

    feed.addEventListener('click', e => {
      const btn = e.target.closest('[id^="like-btn-"]');
      if (btn) triggerLike(parseInt(btn.dataset.idx));
    });

    function triggerLike(idx) {
      const s = state[idx];
      s.liked = !s.liked;
      s.likeCount += s.liked ? 1 : -1;
      const g = document.getElementById(`like-glyph-${idx}`);
      const c = document.getElementById(`like-count-${idx}`);
      const sl = document.getElementById(`stat-likes-${idx}`);
      if (g) {
        g.textContent = s.liked ? '♥' : '♡';
        g.classList.toggle('liked', s.liked);
        g.style.transition = 'none';
        g.style.transform = 'scale(0.65)';
        requestAnimationFrame(() => {
          g.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
          g.style.transform = 'scale(1)';
        });
      }
      if (c) c.textContent = fmtNum(s.likeCount);
      if (sl) sl.querySelector('span:last-child').textContent = fmtNum(s.likeCount);
    }

    feed.addEventListener('click', e => {
      const btn = e.target.closest('[id^="save-btn-"]');
      if (!btn) return;
      const idx = parseInt(btn.dataset.idx);
      state[idx].saved = !state[idx].saved;
      const g = document.getElementById(`save-glyph-${idx}`);
      if (g) {
        g.textContent = state[idx].saved ? '✦' : '⊹';
        g.classList.toggle('saved', state[idx].saved);
      }
    });

    function toggleMute(idx) {
      const v = getVideo(idx);
      if (!v) return;
      muteState[idx] = !v.muted;
      v.muted = muteState[idx];
      showMuteFlash(idx, v.muted);
    }

    function showMuteFlash(idx, muted) {
      const el = document.getElementById(`mf-${idx}`);
      const g = document.getElementById(`mg-${idx}`);
      const l = document.getElementById(`ml-${idx}`);
      if (!el) return;
      g.textContent = muted ? '◌' : '◉';
      l.textContent = muted ? 'muted' : 'sound on';
      el.classList.remove('hide');
      el.classList.add('visible');
      setTimeout(() => { el.classList.remove('visible'); el.classList.add('hide'); }, 100);
    }

    function showHeart(x, y, container) {
      const rect = container.getBoundingClientRect();
      const h = document.createElement('div');
      h.className = 'heart-burst';
      h.textContent = '♥';
      h.style.left = (x - rect.left - 36) + 'px';
      h.style.top = (y - rect.top - 36) + 'px';
      container.appendChild(h);
      requestAnimationFrame(() => {
        h.style.transition = 'transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s 0.55s';
        h.style.transform = 'scale(1)';
        h.style.opacity = '1';
      });
      setTimeout(() => { h.style.opacity = '0'; setTimeout(() => h.remove(), 250); }, 550);
    }

    // Start playback with sound ON
    setTimeout(() => {
      loadVideo(0);
      loadVideo(1);
      playVideo(0);
      startProgress(0);
      loader.classList.add('hidden');
    }, 400);
  </script>
</body>

</html>
