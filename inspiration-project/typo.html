<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swan — Typography Samples</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400&family=DM+Serif+Display:ital@0;1&family=Cinzel:wght@400;600;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@100;200;300;400;600;700&family=Bebas+Neue&family=Italiana&family=Tenor+Sans&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070b08;
            --sage: #a8d5b5;
            --gold: #d4af6e;
            --white: #ffffff;
            --dim: rgba(255, 255, 255, 0.35);
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Tenor Sans', sans-serif;
            min-height: 100vh;
            padding: 48px 24px 80px;
        }

        h1 {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--dim);
            text-align: center;
            margin-bottom: 56px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 3px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Each sample card */
        .sample {
            position: relative;
            aspect-ratio: 3/2;
            background: #0a100b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: default;
        }

        .sample-num {
            position: absolute;
            top: 12px;
            left: 14px;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 9px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--dim);
        }

        /* hover dim overlay */
        .sample::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(168, 213, 181, 0.04);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .sample:hover::after {
            opacity: 1;
        }


        /* ── 01 · Cormorant ultra-light wide spaced ── */
        .s01 {
            background: #070b08;
        }

        .s01 .mark {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 52px;
            letter-spacing: 18px;
            color: #fff;
            text-transform: uppercase;
            text-indent: 18px;
            /* compensate letter-spacing on right */
        }

        .s01 .sub {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 8px;
            font-weight: 300;
            letter-spacing: 5px;
            color: var(--sage);
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* ── 02 · Cinzel with gold rule ── */
        .s02 {
            background: #060a07;
        }

        .s02 .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .s02 .rule {
            width: 80px;
            height: 0.5px;
            background: var(--gold);
            opacity: 0.6;
        }

        .s02 .mark {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: 32px;
            letter-spacing: 12px;
            color: var(--gold);
            text-transform: uppercase;
            text-indent: 12px;
        }

        /* ── 03 · Bodoni italic oversized ── */
        .s03 {
            background: #080d09;
        }

        .s03 .mark {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 76px;
            color: #fff;
            letter-spacing: -1px;
            line-height: 1;
        }

        .s03 .tag {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 7px;
            font-weight: 200;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* ── 04 · Bebas condensed stacked ── */
        .s04 {
            background: #060a07;
        }

        .s04 .wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0 32px;
            width: 100%;
        }

        .s04 .pre {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 8px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--sage);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .s04 .mark {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 86px;
            color: #fff;
            letter-spacing: 6px;
            line-height: 0.9;
        }

        /* ── 05 · DM Serif Display italic with sage accent ── */
        .s05 {
            background: #070c08;
        }

        .s05 .mark {
            font-family: 'DM Serif Display', serif;
            font-style: italic;
            font-size: 58px;
            color: #fff;
            letter-spacing: 2px;
            position: relative;
        }

        .s05 .mark span {
            color: var(--sage);
        }

        .s05 .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--sage);
            margin-top: 12px;
        }

        /* ── 06 · Playfair Display small-caps stacked with horizontal rules ── */
        .s06 {
            background: #060b07;
        }

        .s06 .wrap {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .s06 .vline {
            width: 0.5px;
            height: 64px;
            background: rgba(255, 255, 255, 0.2);
        }

        .s06 .inner {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .s06 .above {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .s06 .mark {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 42px;
            color: #fff;
            letter-spacing: 3px;
            line-height: 1;
        }

        .s06 .below {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 6px;
            color: var(--gold);
            text-transform: uppercase;
        }

        /* ── 07 · Italiana — pure elegance, no decoration ── */
        .s07 {
            background: #050909;
        }

        .s07 .mark {
            font-family: 'Italiana', serif;
            font-size: 72px;
            color: #fff;
            letter-spacing: 8px;
            font-weight: 400;
            text-indent: 8px;
        }

        /* ── 08 · Josefin Sans ultralight all-caps with underline ── */
        .s08 {
            background: #070b08;
        }

        .s08 .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .s08 .mark {
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 100;
            font-size: 38px;
            letter-spacing: 22px;
            text-transform: uppercase;
            color: #fff;
            text-indent: 22px;
        }

        .s08 .underline {
            width: 100%;
            height: 0.5px;
            background: linear-gradient(to right, transparent, rgba(168, 213, 181, 0.6), transparent);
            margin-top: 8px;
        }

        /* ── 09 · Libre Baskerville with SVG swan inline ── */
        .s09 {
            background: #060b07;
        }

        .s09 .wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .s09 .mark {
            font-family: 'Libre Baskerville', serif;
            font-weight: 400;
            font-size: 38px;
            color: #fff;
            letter-spacing: 6px;
        }

        .s09 .swan-icon {
            opacity: 0.85;
            flex-shrink: 0;
        }

        /* ── 10 · Cormorant italic + number superscript — editorial magazine ── */
        .s10 {
            background: #070c08;
        }

        .s10 .wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-right: 32px;
            width: 100%;
        }

        .s10 .edition {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 7px;
            font-weight: 200;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .s10 .mark {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 64px;
            color: #fff;
            letter-spacing: 2px;
            line-height: 1;
        }

        .s10 .rule {
            width: 100%;
            height: 0.5px;
            background: rgba(255, 255, 255, 0.15);
            margin-top: 8px;
        }

        .s10 .tagline {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 7px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h1>Swan — App Name Typography · 10 Samples</h1>

    <div class="grid">

        <!-- 01 -->
        <div class="sample s01">
            <span class="sample-num">01</span>
            <span class="mark">Swan</span>
            <span class="sub">discover</span>
        </div>

        <!-- 02 -->
        <div class="sample s02">
            <span class="sample-num">02</span>
            <div class="wrap">
                <div class="rule"></div>
                <span class="mark">Swan</span>
                <div class="rule"></div>
            </div>
        </div>

        <!-- 03 -->
        <div class="sample s03">
            <span class="sample-num">03</span>
            <span class="mark">Swan</span>
            <span class="tag">scroll · discover · connect</span>
        </div>

        <!-- 04 -->
        <div class="sample s04">
            <span class="sample-num">04</span>
            <div class="wrap">
                <span class="pre">welcome to</span>
                <span class="mark">Swan</span>
            </div>
        </div>

        <!-- 05 -->
        <div class="sample s05">
            <span class="sample-num">05</span>
            <span class="mark">S<span>w</span>an</span>
            <div class="dot"></div>
        </div>

        <!-- 06 -->
        <div class="sample s06">
            <span class="sample-num">06</span>
            <div class="wrap">
                <div class="vline"></div>
                <div class="inner">
                    <span class="above">est. mmxxv</span>
                    <span class="mark">Swan</span>
                    <span class="below">original</span>
                </div>
                <div class="vline"></div>
            </div>
        </div>

        <!-- 07 -->
        <div class="sample s07">
            <span class="sample-num">07</span>
            <span class="mark">Swan</span>
        </div>

        <!-- 08 -->
        <div class="sample s08">
            <span class="sample-num">08</span>
            <div class="wrap">
                <span class="mark">Swan</span>
                <div class="underline"></div>
            </div>
        </div>

        <!-- 09 -->
        <div class="sample s09">
            <span class="sample-num">09</span>
            <div class="wrap">
                <svg class="swan-icon" width="32" height="32" viewBox="0 0 512 512" fill="none">
                    <g transform="matrix(-1,0,0,1,512,0)">
                        <path fill="rgba(168,213,181,0.9)"

                    </g>
                </svg>
                <span class="mark">Swan</span>
            </div>
        </div>

        <!-- 10 -->
        <div class="sample s10">
            <span class="sample-num">10</span>
            <div class="wrap">
                <span class="edition">vol. i — mmxxv</span>
                <span class="mark">Swan</span>
                <div class="rule"></div>
                <span class="tagline">original content</span>
            </div>
        </div>

    </div>

</body>

</html>
