# Netlify config — deploys ONLY the extraction function (not the Next.js app,
# which lives on Cloudflare Pages). The function runs on AWS Lambda egress IPs
# to reach eat-peach.sbs, which blocks Cloudflare's IPs.
[build]
  command = "echo 'functions-only deploy'"
  publish = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  # This repo contains a Next.js app (deployed on Cloudflare), but on Netlify
  # we only want the extraction function. Skip Netlify's auto-injected Next.js
  # plugin so it doesn't look for Next build output and fail.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

[functions.extract]
  timeout = 26

[functions.moviebox]
  timeout = 26
